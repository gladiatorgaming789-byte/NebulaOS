name: Build NebulaForge ISO
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate source and run unit tests
        run: bash ./scripts/validate-source.sh
      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-common grub-pc-bin grub-efi-amd64-bin mtools
      - name: Build ISO (direct builder; no live-build)
        run: sudo bash ./scripts/build-iso.sh
      - name: Verify ISO structure and boot-menu wiring
        run: bash ./scripts/verify-iso.sh dist/NebulaForge-OS-amd64.iso
      - name: Verify published checksum manifest
        run: |
          cd dist
          sha256sum -c SHA256SUMS
      - name: Upload ISO and manifests as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NebulaForge-OS-amd64
          path: |
            dist/NebulaForge-OS-amd64.iso
            dist/SHA256SUMS
            dist/build-manifest.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish ISO to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: NebulaForge OS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/NebulaForge-OS-amd64.iso
            dist/SHA256SUMS
            dist/build-manifest.txt
